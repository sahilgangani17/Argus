# Argus Custom Rule Template — Exposed .env File
#
# Checks if the root /.env file is publicly accessible and contains key-value
# pairs typical of Laravel / Django / Node.js environment configuration.
# An exposed .env leaks secrets (API keys, DB passwords, private tokens).
#
# Severity: exposed_file (base score 5.0)
# Confidence: confirmed — we verify BOTH a 200 status AND the presence of
#             environment-style content before reporting.

id: argus-exposed-env
name: Exposed .env File
description: >
  The application's .env file is publicly readable. This file typically
  contains database credentials, API keys, and other secrets. Immediate
  remediation is required — restrict access via web-server configuration
  (e.g. deny all in Nginx/Apache for files beginning with a dot).
severity: exposed_file
confidence: confirmed

request:
  method: GET
  path: /.env
  headers: {}
  body: null
  params: {}

matchers:
  - type: status
    values: [200]
  - type: word
    # Common keys found in .env files across frameworks
    values:
      - "APP_KEY"
      - "DB_PASSWORD"
      - "SECRET_KEY"
      - "DATABASE_URL"
      - "REDIS_URL"
      - "AWS_SECRET"
      - "API_KEY"
      - "PRIVATE_KEY"
  - type: regex
    # Match lines like  SOME_VAR=some_value  which is the .env key=value format
    values:
      - "[A-Z][A-Z0-9_]+=.+"

# ALL three conditions must hold:
# (1) server returns 200, (2) at least one sensitive key word is present,
# (3) content looks like key=value lines.
matcher_condition: and
